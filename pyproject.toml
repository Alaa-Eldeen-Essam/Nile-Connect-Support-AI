[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "we-telecom-agent"
version = "0.1.0"
description = "Portfolio web application for a tool-calling WE Telecom support agent."
requires-python = ">=3.11,<3.14"
dependencies = [
  "certifi>=2025.1.31",
  "cryptography>=44.0.0",
  "fastapi>=0.115.0,<1.0",
  "langchain>=1.0.0,<2.0",
  "langchain-classic>=1.0.0,<2.0",
  "langchain-community>=0.4.0,<1.0",
  "langchain-google-genai>=3.0.0,<4.0",
  "langchain-huggingface>=1.0.0,<2.0",
  "langchain-mongodb>=0.11.0,<1.0",
  "langchain-qdrant>=1.0.0,<2.0",
  "langchain-text-splitters>=1.0.0,<2.0",
  "pymongo>=4.10.0,<5.0",
  "qdrant-client>=1.13.2,<1.14.0",
  "sentence-transformers>=3.3.0,<4.0",
  "uvicorn[standard]>=0.34.0,<1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0", "ruff>=0.9.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["build"]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.setuptools.packages.find]
include = ["app*"]
