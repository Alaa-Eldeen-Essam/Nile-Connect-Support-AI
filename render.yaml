services:
  - type: web
    name: we-telecom-agent
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: APP_ENV
        value: production
      - key: PROFILE_STORAGE
        value: mongo
      - key: QDRANT_MODE
        value: local
      - key: MONGO_DB
        value: we_telecom_db
      - key: GOOGLE_API_KEY
        sync: false
      - key: MONGO_URI
        sync: false
      - key: SETTINGS_ENCRYPTION_KEY
        sync: false
      - key: SETTINGS_ADMIN_TOKEN
        sync: false
